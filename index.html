<!--
  현장체험 평가단 신고 및 조치 관리 시스템 시제품 (요구 전달용)
  버전: v1.5  |  수정일: 2026-10-28
  근거: 참고3_현장체험평가단_신고조치관리시스템_구성안_20261028.docx
  성격: 브라우저 안에서만 동작(서버 없음). 입력 내용은 이 브라우저에 저장되며 [예시 데이터 초기화]로 처음 상태 복원.
        신고 내용과 처리 일시는 예시이며 실제 사례가 아님. CPPRMS 실제 코드 아님.
  v1.0 (2026-10-28) 최초 작성: 평가단(모바일) 신고, 확인, 만족도 / SPC 조치 계획, 완료, 이의 제기 / 센터 접수, 반려, 종결, 노선별 집계.
        이벤트 단위 처리 이력과 단계별 일시 자동 기록, 처리 기한 초과 시 지연 표시, 미개선 확인 시 재조치.
  v1.1 (2026-10-28) 시험 서버 연동: 서버 주소(http)로 열면 서버 데이터를 여러 기기가 공유(4초마다 갱신, 동시 처리 충돌 시 최신 상태로 갱신),
        파일로 열면 기존처럼 이 브라우저에만 저장. 처리 기간을 개선이 확인된 조치의 완료 일시 기준으로 변경.
  v1.2 (2026-10-28) claude.ai 아티팩트 게시본 지원(ARTDB): 공유 저장소에 이벤트 1건당 문서 1개로 저장, 실시간 갱신,
        접수번호는 공유 카운터로 부여, 동시 처리 시 먼저 저장된 건 우선. 사진은 긴 변 720px로 줄여 저장.
  v1.3 (2026-10-28) 로그인 추가: 평가단 코드, SPC 노선 계정, 센터 계정 + 비밀번호(PIN)로 로그인, 계정 역할 화면만 표시
        (평가단, SPC는 자기 노선만). 역할 전환 버튼 삭제, 로그아웃 추가. 비밀번호 확인은 화면에서 하는 시연용이며
        실제 시스템은 서버 인증, 비밀번호 암호화 저장, 위탁업체의 코드 발급 및 중지 관리 필요.
  v1.4 (2026-10-28) 동시 통보 방식: 신고 등록 즉시 SPC와 센터에 동시 통보(센터 접수 단계 삭제), 신고 직후 상태 '조치 대기'.
        센터는 모니터링, 평가 제외(중복, 평가 대상 외), 종결 처리. SPC는 평가 제외 건도 목록에서 확인.
  v1.5 (2026-10-28) PWA(설치형 웹앱) 지원: 시험 서버로 열면 앱 설치 가능(HTTPS 또는 이 PC 주소), 앱 아이콘, 전체 화면 실행,
        연결 끊김 시 저장된 화면 표시. 상단 [앱으로 설치] 버튼, 아이폰은 '홈 화면에 추가' 안내.

<body>
<div class="demobar">
  <b>현장체험 평가단 신고 시스템</b><span class="tag">시제품 / 예시 데이터 / 이 기기에만 저장</span>
  <div class="who" id="who"></div>
  <button class="rst" id="instBtn" onclick="installApp()" hidden style="color:#fff;font-weight:700">앱으로 설치</button>
  <button class="rst" onclick="resetAll()">예시 데이터 초기화</button>
</div>
<div id="app"></div>
<div id="toast"></div>

<script>
/* ===== 기준 정보 (참고 3 구성안) ===== */
const LINES={
  '서해선':{spc:'이레일',st:['소사','소새울','시흥대야','신천','신현','시흥시청','시흥능곡','달미','선부','초지','시우','원시']},
  '신분당선':{spc:'신분당선',st:['강남','양재','양재시민의숲','청계산입구','판교','정자']},
  '공항철도':{spc:'공항철도',st:['서울역','공덕','홍대입구','디지털미디어시티','마곡나루','김포공항','계양','검암','청라국제도시','영종','운서','인천공항1터미널','인천공항2터미널']},
  'GTX-A':{spc:'에스지레일',st:['운정중앙','킨텍스','대곡','연신내','수서','성남','구성','동탄']},
};
const LOCS=['승강장','대합실','출입구','환승통로','화장실','열차 내'];
const CATS=[
  {k:'안전',ex:'PSD 장애, 비상호출벨 무응답, 1인 역사 무인 방치',days:0,kpi:'③ ④'},
  {k:'교통약자 이동편의시설',ex:'엘리베이터, 에스컬레이터, 휠체어 리프트 고장',days:3,kpi:'⑥'},
  {k:'역사 편의시설',ex:'화장실, 안내표지, 조명, 냉난방 고장 및 파손',days:3,kpi:'⑥'},
  {k:'열차 운행 및 안내',ex:'지연 안내 미흡, 전광판 및 안내방송 오류',days:3,kpi:'⑦'},
];
const CODES={'서해선':['서해선-023','서해선-031'],'신분당선':['신분당선-011','신분당선-018'],'공항철도':['공항철도-042','공항철도-007'],'GTX-A':['GTX-A-007','GTX-A-015']};
const ALLCODES=Object.values(CODES).flat();
const lineOf=code=>Object.keys(CODES).find(l=>CODES[l].includes(code));
/* 시연용 계정: 평가단 코드는 위탁업체 발급, SPC와 센터는 담당자 계정 (비밀번호 공통 1234, 실제는 개별 발급) */
const DEMO_PIN='1234';
const SPC_ID={'서해선':'SPC-SEOHAE','신분당선':'SPC-SINBUNDANG','공항철도':'SPC-AREX','GTX-A':'SPC-GTXA'};
const ACC=[...ALLCODES.map(c=>({id:c,role:'r',line:lineOf(c),name:'평가단 '+c})),
  ...Object.keys(LINES).map(l=>({id:SPC_ID[l],role:'s',line:l,name:LINES[l].spc+' 담당자 ('+l+')'})),

/* 공유 저장소 저장: 내가 본 버전(rev)과 저장소 버전이 다르면 다른 사용자가 먼저 처리한 것 */
async function adbSave(e){
  const base=e.rev||0;
  try{ const ref=ADB.collection('ev').doc(e.id); const cur=await ref.get();
    if(cur.exists&&(cur.data().rev||0)!==base){ const i=DB.ev.findIndex(x=>x.id===e.id); if(i>=0) DB.ev[i]=plain(cur.data()); render(); tst('다른 사용자가 먼저 처리함, 최신 상태로 갱신'); return; }
    e.rev=base+1; await ref.set(plain(e));
  }catch(err){ tst('저장 실패 ('+(err&&err.code||'연결 확인 필요')+')'); }
}
/* 신규 신고: 공유 카운터를 잠깐 잠그고 다음 번호를 받아 접수번호 부여 */
async function adbNew(e){
  const ref=ADB.doc('meta/counter'), holder=Math.random().toString(36).slice(2);
  for(let i=0;i<20;i++){
    const a=await ref.acquire({holder,ttlMs:5000});
    if(a.acquired){ const c=await ref.get(); const seq=((c.exists&&c.data().seq)||0)+1; await ref.set({seq});
      const now=Date.now(); e.id='EV-'+fmtYM(now)+'-'+String(seq).padStart(4,'0'); e.t.rep=now; e.t.acc=now; e.hist.forEach(h=>h.t=now); e.rev=0;
      await ADB.collection('ev').doc(e.id).set(plain(e)); return e; }
    await new Promise(r=>setTimeout(r,300+Math.random()*300));
  }
  throw {code:'busy'};
}

async function api(method,url,body){ try{ const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}); let j={}; try{ j=await r.json(); }catch(e){} return {ok:r.ok,status:r.status,j}; }catch(e){ return {ok:false,status:0,j:{}}; } }
function save(e){

    if(r.status===409){ const i=DB.ev.findIndex(x=>x.id===e.id); if(i>=0) DB.ev[i]=r.j.ev; render(); tst('다른 사용자가 먼저 처리함, 최신 상태로 갱신'); }
    else if(r.ok){ e.rev=r.j.rev; }
    else tst('서버 저장 실패, 연결 확인 필요');
  });
}

/* 예시 이벤트: 현재 시각 기준 상대 시간으로 생성 */
function seed(){
  const now=Date.now(), at=(d,h,m=0)=>{const t=new Date(now-d*D); t.setHours(h,m,0,0); return t.getTime();};

    if(steps.plan){ e.status='조치중'; e.plan={txt:steps.plan[1],due:steps.plan[2]}; e.t.plan=steps.plan[0]; e.hist.push({t:steps.plan[0],who:'SPC',what:'조치 계획 등록'}); }
    if(steps.done){ e.status='조치완료'; e.act={txt:steps.done[1],photo:null}; e.t.done=steps.done[0]; e.hist.push({t:steps.done[0],who:'SPC',what:'조치 완료 등록'}); }
    if(steps.chk){ const ok=steps.chk[1]; e.check={ok,memo:steps.chk[2],by:steps.chk[3]||code}; e.t.chk=steps.chk[0];
      e.hist.push({t:steps.chk[0],who:'평가단',by:e.check.by,what:ok?'현장 확인: 개선됨':'현장 확인: 미개선, 재조치 요청'}); e.status=ok?'확인완료':'재조치'; if(!ok){ e.round=2; e.t.done=null; } }
    if(steps.close){ e.status='종결'; e.t.close=steps.close; e.hist.push({t:steps.close,who:'센터',what:'종결 처리'}); }
    ev.push(e);
  };
  mk('GTX-A','동탄','승강장','교통약자 이동편의시설','상행 에스컬레이터 정지, 안내 입간판만 있음','GTX-A-007',

  mk('서해선','신천','출입구','교통약자 이동편의시설','2번 출입구 엘리베이터 운행 중지, 우회 안내 없음','서해선-023',
    {rep:at(9,7,40),acc:at(9,9,0),plan:[at(8,11),'제조사 수리 요청, 부품 수급 대기',''],done:[at(3,15,0),'제어반 교체 완료'],chk:[at(2,18,30),true,'운행 재개 확인']});
  mk('서해선','시흥대야','승강장','안전','PSD 1개소 개폐 불량, 역무원 부재로 안내 없음','서해선-023',
    {rep:at(6,7,10),acc:at(6,7,45),plan:[at(6,8,30),'유지보수 인력 긴급 출동',''],done:[at(6,15,0),'센서 정렬 조정, 정상 작동'],chk:[at(6,18,40),true,'퇴근 시 정상 작동 확인'],close:at(5,10)});
  mk('신분당선','정자','대합실','안전','휴게시간 중 역무실 무인, 비상 시 안내 불가 상태','신분당선-011',

  mk('공항철도','검암','승강장','안전','비상호출벨 작동 후 약 3분간 응답 없음','공항철도-042',
    {rep:at(4,19,5),acc:at(4,19,30),plan:[at(4,21),'호출벨 회선 점검',''],done:[at(3,11,0),'호출벨 회선 점검 완료'],chk:[at(3,18,0),false,'재시험 시 응답 지연 지속 (약 2분)']});
  mk('신분당선','판교','출입구','역사 편의시설','4번 출입구 방면 안내표지 파손','신분당선-011',
    {rep:at(3,8,30),acc:at(3,9,10),plan:[at(2,10),'표지 제작 의뢰',''],done:[at(1,16,0),'안내표지 교체 완료']});
  mk('서해선','초지','대합실','역사 편의시설','대합실 바닥 음료 쏟아짐, 청소 요청','서해선-023',{rep:at(2,10,0),rej:[at(2,10,40),REJECTS[0]]});

    {rep:at(2,9,15),acc:at(2,9,50),plan:[at(1,10),'배관 업체 점검 예정',fmtD(Date.now()+D)]});
  mk('공항철도','김포공항','환승통로','교통약자 이동편의시설','환승통로 무빙워크 1기 정지','공항철도-042',{rep:at(1,8,0),acc:at(1,8,40)});

  /* 월별 체감 만족도 예시 */
  const ym=fmtYM(now), sat=[];
  [['서해선-031',[3,4,2]],['신분당선-018',[4,4,4]],['공항철도-007',[4,3,4]],['GTX-A-015',[5,4,4]],['신분당선-011',[4,5,3]]].forEach(([c,s])=>sat.push({code:c,line:lineOf(c),ym,s,memo:'',t:now-3*D}));

/* ===== 계산 ===== */
function fmtYM(t){const d=new Date(t);return String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0');}
function fmtD(t){const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtT(t){ if(!t) return '-'; const d=new Date(t); return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
const catOf=k=>CATS.find(c=>c.k===k);
/* 처리 기한: 안전은 신고 당일 자정, 그 외 신고 후 3일 */
function dueOf(e){ const c=catOf(e.cat); const d=new Date(e.t.rep); if(c.days===0){ d.setHours(23,59,59,999); return d.getTime(); } return e.t.rep+c.days*D; }
const isOpen=e=>!['종결','반려','확인완료'].includes(e.status);
/* 처리 완료 시점: 평가단이 개선을 확인한 조치의 완료 일시 (평가단 확인이 늦어도 SPC 지연으로 보지 않음)
   지연: 처리 완료 시점(미완료면 현재 시각)이 기한을 넘긴 건. 확인 대기 중이면 조치 완료 일시 기준 */
function endOf(e){ if(e.t.done&&(e.status==='조치완료'||(e.check&&e.check.ok))) return e.t.done; return Date.now(); }
function isLate(e){ if(e.status==='반려') return false; return endOf(e)>dueOf(e); }
function spanH(e){ return (e.check&&e.check.ok&&e.t.done)? (e.t.done-e.t.rep)/H : null; }
function fmtSpan(h){ if(h==null) return '-'; if(h<24) return Math.max(1,Math.round(h))+'시간'; return (h/24).toFixed(1)+'일'; }
function chipHtml(e){ const map={'신고':'조치 대기','접수':'조치 대기','조치완료':'확인 대기','확인완료':'종결 대기','반려':'평가 제외'}; return '<span class="chip s-'+e.status+'">'+(map[e.status]||e.status)+'</span>'+(isLate(e)&&e.status!=='반려'?' <span class="chip late">지연</span>':''); }
function addHist(e,who,what,by){ const h={t:Date.now(),who,what}; if(by) h.by=by; e.hist.push(h); }
function findEv(id){ return DB.ev.find(e=>e.id===id); }

/* ===== 공통 ===== */
const $=id=>document.getElementById(id);
let toT; function tst(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(toT);toT=setTimeout(()=>e.classList.remove('on'),2200);}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function photoHtml(p,label){ return p?'<img class="photo" src="'+p+'" alt="'+label+'">':'<div class="nophoto">'+label+' 없음 (예시 데이터)</div>'; }
/* 사진은 긴 변 720px로 줄여 저장 */
function readPhoto(input,cb){ const f=input.files&&input.files[0]; if(!f) return cb(null);
  const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,720/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=img.width*k; c.height=img.height*k; c.getContext('2d').drawImage(img,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',0.66)); }; img.src=r.result; }; r.readAsDataURL(f); }
function timeline(e,showCode){
  return '<ul class="tl">'+e.hist.map(h=>{ const cls=/개선됨|종결|완료/.test(h.what)?'done':/미개선|반려|제외|재조치/.test(h.what)?'badd':'';
    const who=h.who==='평가단'&&!showCode?'평가단':h.who==='평가단'?'평가단 '+esc(h.by||e.code):h.who;
    return '<li class="'+cls+'"><div>'+esc(h.what)+'</div><div class="t">'+fmtT(h.t)+' / '+who+'</div></li>'; }).join('')+'</ul>';
}
function go(v){ UI.view=v; render(); window.scrollTo(0,0); }
function render(){
  const me=UI.me;
  $('who').innerHTML=me?'<span><b>'+esc(me.name)+'</b></span><button onclick="logout()">로그아웃</button>':'';
  if(!me){ $('app').innerHTML=loginView(); bindLogin(); return; }
  UI.view=me.role; if(me.role==='r') UI.rCode=me.id; if(me.role==='s') UI.sLine=me.line;
  $('app').innerHTML = UI.view==='r'?rView():UI.view==='s'?sView():cView(); afterRender();
}
function loginView(){
  const grp=(t,list)=>'<div class="grp"><span>'+t+'</span>'+list.map(a=>'<button type="button" data-id="'+esc(a.id)+'">'+esc(a.id)+'</button>').join('')+'</div>';

let NEWPHOTO=null;
function bindNew(){
  NEWPHOTO=null;
  $('nCats').querySelectorAll('input').forEach(r=>r.onchange=()=>$('nCats').querySelectorAll('label').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked)));
  $('nPhoto').onchange=()=>readPhoto($('nPhoto'),p=>{ NEWPHOTO=p; $('nPrev').innerHTML=p?'<img class="photo" src="'+p+'" alt="신고 사진 미리보기">':''; });
  $('nSubmit').onclick=()=>{
    const desc=$('nDesc').value.trim();
    if(!desc){ tst('내용 입력 필요'); return; }
    if(NEWPHOTO&&!$('nAgree').checked){ tst('사진 개인정보 확인란 체크 필요'); return; }
    const line=lineOf(UI.rCode), now=Date.now();
    DB.seq=(DB.seq||0)+1;
    const e={id:'EV-'+fmtYM(now)+'-'+String(DB.seq).padStart(4,'0'),line,stn:$('nStn').value,loc:$('nLoc').value,cat:document.querySelector('input[name=cat]:checked').value,
      desc,code:UI.rCode,photo:NEWPHOTO,status:'접수',t:{rep:now,acc:now},hist:[{t:now,who:'평가단',what:'신고 등록'},{t:now,who:'시스템',what:'SPC, 센터 동시 통보 (자동)'}],plan:null,act:null,check:null,reject:null,objection:null,round:1};
    if(ARTDB){ $('nSubmit').disabled=true; adbNew(e).then(ev=>{ if(!DB.ev.some(x=>x.id===ev.id)) DB.ev.push(ev); UI.rTab='home'; UI.rDetail=ev.id; render(); tst('신고 등록 완료 / SPC, 센터 동시 통보'); }).catch(err=>{ $('nSubmit').disabled=false; tst('신고 저장 실패 ('+(err&&err.code||'연결 확인 필요')+')'); }); return; }
    if(SERVER){ $('nSubmit').disabled=true; api('POST','/api/ev',e).then(r=>{ if(!r.ok){ $('nSubmit').disabled=false; tst('서버 저장 실패, 연결 확인 필요'); return; } DB.ev.push(r.j.ev); UI.rTab='home'; UI.rDetail=r.j.ev.id; render(); tst('신고 등록 완료 / SPC, 센터 동시 통보'); }); return; }
    DB.ev.push(e); save(); UI.rTab='home'; UI.rDetail=e.id; render(); tst('신고 등록 완료 / SPC, 센터 동시 통보');
  };
}

function doCheck(id,ok){
  const e=findEv(id), memo=$('m_'+id).value.trim();

  const now=Date.now(); e.check={ok,memo,by:UI.rCode}; e.t.chk=now;
  if(ok){ e.status='확인완료'; addHist(e,'평가단','현장 확인: 개선됨'+(memo?' ('+memo+')':''),UI.rCode); tst('개선 확인 / 센터 종결 대기'); }
  else { e.status='재조치'; e.round=(e.round||1)+1; e.t.done=null; addHist(e,'평가단','현장 확인: 미개선, 재조치 요청 ('+memo+')',UI.rCode); tst('재조치 요청 / SPC 재통보'); }
  save(e); render();
}

    +(e.check&&!e.check.ok?'<div class="box" style="background:var(--badBg)"><b style="color:var(--bad)">평가단 미개선 확인</b>'+esc(e.check.memo)+'</div>':'')
    +(e.plan?'<div class="box"><b>등록한 조치 계획</b>'+esc(e.plan.txt)+(e.plan.due?' (예정 '+e.plan.due+')':'')+'</div>':'')
    +(e.act&&e.status!=='재조치'?'<div class="box"><b>조치 결과</b>'+esc(e.act.txt)+'</div>':'')
    +act
    +(isOpen(e)?'<details style="margin-top:14px"><summary style="cursor:pointer;font-size:12.5px;color:var(--sub);font-weight:700">조치 불가 사유 또는 이의 제기</summary><textarea class="in" id="sObj" style="margin-top:6px" placeholder="예) 평가 대상 외 시설(타 기관 관리)">'+esc(e.objection||'')+'</textarea><div class="acts"><button class="btn" onclick="doObj(\''+e.id+'\')">이의 제기 등록</button></div></details>':'')
    +'<div style="margin-top:14px;font-weight:700;font-size:13px">처리 이력</div>'+timeline(e,false);
}
function doPlan(id){ const e=findEv(id), txt=$('sPlan').value.trim(); if(!txt){ tst('조치 계획 입력 필요'); return; }
  e.plan={txt,due:$('sDue').value}; e.t.plan=Date.now(); e.status='조치중'; addHist(e,'SPC','조치 계획 등록'); save(e); render(); tst('조치 계획 등록'); }
function doDone(id){ const e=findEv(id), txt=$('sAct').value.trim(); if(!txt){ tst('조치 완료 내용 입력 필요'); return; }
  const inp=$('sPhoto'); if(!inp.files.length){ tst('조치 후 사진 필수'); return; }
  readPhoto(inp,p=>{ e.act={txt,photo:p}; e.t.done=Date.now(); e.status='조치완료'; addHist(e,'SPC','조치 완료 등록'+(e.round>1?' (재조치)':'')); save(e); render(); tst('조치 완료 등록 / 평가단 확인 요청'); }); }
function doObj(id){ const e=findEv(id), txt=$('sObj').value.trim(); if(!txt){ tst('사유 입력 필요'); return; }
  e.objection=txt; addHist(e,'SPC','이의 제기 등록 ('+txt+')'); save(e); render(); tst('이의 제기 등록 / 센터 검토'); }

/* ===== 센터 ===== */
function cView(){
  const all=DB.ev;
  const open=all.filter(isOpen);
  const spans=all.map(spanH).filter(v=>v!=null);
  const avg=spans.length?spans.reduce((a,b)=>a+b,0)/spans.length:null;
  return '<div class="pc"><div class="pchead"><h1>현장체험 평가단 신고 관리</h1><span class="who">민자철도관리지원센터 / 4개 노선</span></div>'
    +'<div class="tabs2"><button class="'+(UI.cTab==='ev'?'on':'')+'" onclick="UI.cTab=\'ev\';render()">이벤트 관리</button><button class="'+(UI.cTab==='agg'?'on':'')+'" onclick="UI.cTab=\'agg\';render()">노선별 집계</button></div>'
    +(UI.cTab==='ev'
      ?'<div class="kpis"><div class="kpi"><div class="l">SPC 조치 대기 (미착수)</div><div class="v num">'+all.filter(e=>['신고','접수','재조치'].includes(e.status)).length+'<small> 건</small></div></div>'
        +'<div class="kpi"><div class="l">처리 중 (조치 대기~확인 대기)</div><div class="v num">'+open.length+'<small> 건</small></div></div>'
        +'<div class="kpi red"><div class="l">처리 기한 초과 (진행 중)</div><div class="v num">'+open.filter(isLate).length+'<small> 건</small></div></div>'
        +'<div class="kpi"><div class="l">평균 조치 완료 기간 (신고~조치 완료)</div><div class="v num">'+fmtSpan(avg)+'</div></div></div>'+cEvents()
      :cAgg())+'</div>';
}
function cEvents(){
  let list=DB.ev.slice().sort((a,b)=>b.t.rep-a.t.rep);
  if(UI.cLine) list=list.filter(e=>e.line===UI.cLine);
  if(UI.cStat) list=list.filter(e=>e.status===UI.cStat);
  if(UI.cLate) list=list.filter(e=>isOpen(e)&&isLate(e));
  const sel=UI.cSel&&findEv(UI.cSel);
  const ST=['접수','조치중','조치완료','재조치','확인완료','종결','반려'], STN={'접수':'조치 대기','조치완료':'확인 대기','확인완료':'종결 대기','반려':'평가 제외'};
  return '<div class="split"><div class="panel"><div class="filters">'
    +'<select onchange="UI.cLine=this.value;render()" aria-label="노선"><option value="">전체 노선</option>'+Object.keys(LINES).map(l=>'<option'+(UI.cLine===l?' selected':'')+'>'+l+'</option>').join('')+'</select>'
    +'<select onchange="UI.cStat=this.value;render()" aria-label="상태"><option value="">전체 상태</option>'+ST.map(s=>'<option value="'+s+'"'+(UI.cStat===s?' selected':'')+'>'+(STN[s]||s)+'</option>').join('')+'</select>'
    +'<label><input type="checkbox" '+(UI.cLate?'checked':'')+' onchange="UI.cLate=this.checked;render()"> 기한 초과만</label>'
    +'<span style="margin-left:auto;font-size:12.5px;color:var(--gray)">'+list.length+'건</span></div>'
    +(list.length?'<table class="lst"><thead><tr><th>접수번호</th><th>노선</th><th>역 / 위치</th><th>유형</th><th>신고 일시</th><th>평가단</th><th>상태</th></tr></thead><tbody>'
      +list.map(e=>'<tr class="'+(UI.cSel===e.id?'sel':'')+'" onclick="UI.cSel=\''+e.id+'\';render()"><td class="num">'+e.id+'</td><td>'+e.line+'</td><td class="l">'+esc(e.stn)+' / '+esc(e.loc)+'</td><td>'+esc(e.cat)+'</td><td class="num">'+fmtT(e.t.rep)+'</td><td>'+esc(e.code)+'</td><td>'+chipHtml(e)+'</td></tr>').join('')+'</tbody></table>'
      :'<div class="empty">조건에 맞는 신고 없음</div>')
    +'</div><div class="panel">'+(sel?cDetail(sel):'<div class="empty">목록에서 이벤트를 선택</div>')+'</div></div>';
}
function cDetail(e){
  let act='';
  if(e.status==='확인완료') act='<div class="acts"><button class="btn pri" onclick="doClose(\''+e.id+'\')">종결 처리</button></div>';
  if(isOpen(e)||e.status==='확인완료') act+='<details style="margin-top:12px"><summary style="cursor:pointer;font-size:12.5px;color:var(--sub);font-weight:700">평가 제외 처리 (중복, 평가 대상 외)</summary><select class="in" id="cRej" style="margin-top:6px">'+REJECTS.map(r=>'<option>'+r+'</option>').join('')+'</select><div class="acts"><button class="btn bad" onclick="doReject(\''+e.id+'\')">평가 제외</button></div></details>';
  return '<h3>'+e.id+' '+chipHtml(e)+'</h3>'
    +'<dl class="dl"><dt>노선 (SPC)</dt><dd>'+e.line+' ('+LINES[e.line].spc+')</dd><dt>역 / 위치</dt><dd>'+esc(e.stn)+' / '+esc(e.loc)+'</dd><dt>신고 유형</dt><dd>'+esc(e.cat)+' (연계 지표 '+catOf(e.cat).kpi+')</dd>'
    +'<dt>평가단</dt><dd>'+esc(e.code)+'</dd><dt>처리 기한</dt><dd>'+fmtT(dueOf(e))+'</dd><dt>처리 기간</dt><dd>'+fmtSpan(spanH(e))+(e.round>1?' / 재조치 '+(e.round-1)+'회':'')+'</dd></dl>'
    +'<div class="box"><b>신고 내용</b>'+esc(e.desc)+'</div>'+photoHtml(e.photo,'신고 사진')
    +(e.objection?'<div class="box" style="background:var(--warnBg)"><b style="color:var(--warn)">SPC 이의 제기</b>'+esc(e.objection)+'</div>':'')
    +(e.act?'<div class="box"><b>SPC 조치 결과</b>'+esc(e.act.txt)+'</div>'+(e.act.photo?photoHtml(e.act.photo,'조치 후 사진'):''):'')
    +(e.check?'<div class="box"><b>평가단 현장 확인 ('+esc(e.check.by)+')</b>'+(e.check.ok?'개선됨':'미개선')+(e.check.memo?' / '+esc(e.check.memo):'')+'</div>':'')
    +act
    +'<div style="margin-top:14px;font-weight:700;font-size:13px">처리 이력 (단계별 일시 자동 기록)</div>'+timeline(e,true);
}
function doReject(id){ const e=findEv(id), r=$('cRej').value; e.status='반려'; e.reject=r; addHist(e,'센터','평가 제외 ('+r+')'); save(e); render(); tst('평가 제외 처리 / SPC 화면에 표시'); }
function doClose(id){ const e=findEv(id); e.status='종결'; e.t.close=Date.now(); addHist(e,'센터','종결 처리'); save(e); render(); tst('종결 / 처리 기간 '+fmtSpan(spanH(e))); }
function cAgg(){
  const ym=fmtYM(Date.now());
  const rows=Object.keys(LINES).map(l=>{
    const ev=DB.ev.filter(e=>e.line===l), valid=ev.filter(e=>e.status!=='반려'&&e.status!=='신고');
    const fixed=valid.filter(e=>e.check&&e.check.ok), inTime=fixed.filter(e=>!isLate(e)).length;
    const sp=fixed.map(spanH), avg=sp.length?sp.reduce((a,b)=>a+b,0)/sp.length:null;
    const mov=fixed.filter(e=>e.cat==='교통약자 이동편의시설').map(spanH), mavg=mov.length?mov.reduce((a,b)=>a+b,0)/mov.length:null;
    const sat=DB.sat.filter(s=>s.line===l&&s.ym===ym), savg=sat.length?sat.reduce((a,s)=>a+s.s.reduce((x,y)=>x+y,0)/3,0)/sat.length:null;
    const unm=valid.filter(e=>/무인/.test(e.desc)).length;
    return {l,n:ev.length,valid:valid.length,fixed:fixed.length,rate:valid.length?inTime/valid.length*100:null,avg,mavg,late:valid.filter(e=>isOpen(e)&&isLate(e)).length,savg,sn:sat.length,unm};
  });
  return '<div class="panel"><h3>노선별 처리 실적 (누계, 만족도는 이번 달)</h3><table class="agg"><thead><tr><th>노선 (SPC)</th><th>신고</th><th>접수</th><th>개선 확인</th>'
    +'<th>기한 내 처리율<small>지표 ⑤</small></th><th>평균 조치 완료 기간<small>지표 ⑤</small></th><th>이동편의시설 방치 기간<small>지표 ⑥</small></th><th>기한 초과 진행 건</th><th>체감 만족도<small>지표 ⑧, 5점 만점</small></th><th>무인 방치 신고<small>지표 ③</small></th></tr></thead><tbody>'
    +rows.map(r=>'<tr><td class="l">'+r.l+' ('+LINES[r.l].spc+')</td><td class="num">'+r.n+'</td><td class="num">'+r.valid+'</td><td class="num">'+r.fixed+'</td><td class="num">'+(r.rate==null?'-':r.rate.toFixed(0)+'%')+'</td><td class="num">'+fmtSpan(r.avg)+'</td><td class="num">'+fmtSpan(r.mavg)+'</td><td class="num" style="'+(r.late?'color:var(--bad);font-weight:800':'')+'">'+r.late+'</td><td class="num">'+(r.savg==null?'-':r.savg.toFixed(1)+' ('+r.sn+'명)')+'</td><td class="num">'+r.unm+'</td></tr>').join('')
    +'</tbody></table><div class="note">○ 기한 내 처리율 = 처리 기한 안에 조치를 완료하고 평가단이 개선을 확인한 건 / 접수 건 (안전 당일, 그 외 3일)<br>○ 평균 조치 완료 기간 = 신고 일시부터 개선이 확인된 조치의 완료 일시까지 (미개선 시 재조치 완료 일시 기준, 평가단 확인 지연은 미반영)<br>○ 평가단 개인별 활동량이 아닌 노선별 처리 실적 기준 집계, 운영평가 시 월 또는 분기 단위로 산출</div></div>';
}

init();
</script>
</body>
</html>
